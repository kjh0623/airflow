name: verify-jwt-500
on:
  push:
    branches: [ci/jwt-500-verify]
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: >
          sudo apt-get update -q && sudo apt-get install -y --no-install-recommends
          libkrb5-dev default-libmysqlclient-dev libldap2-dev libsasl2-dev pkg-config
      - run: uv sync
      - run: uv run pytest airflow-core/tests/unit/api_fastapi/auth/middlewares/test_refresh_token.py -v
